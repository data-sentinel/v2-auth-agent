version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # oauth2-proxy — OIDC broker between the browser and Azure AD (Office 365)
  # All browser traffic hits this service on OAUTH2_PROXY_PORT (default 4180).
  # It handles the full OAuth2/OIDC handshake, then forwards authenticated
  # requests to ds-auth:7000 with X-Auth-Request-* headers injected.
  # ---------------------------------------------------------------------------
  oauth2_proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    ports:
      - "4180:4180"
    environment:
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://sts.windows.net/${AZURE_TENANT_ID}/
      - OAUTH2_PROXY_CLIENT_ID=${AZURE_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - OAUTH2_PROXY_REDIRECT_URL=${SSO_REDIRECT_URL}
      - OAUTH2_PROXY_UPSTREAMS=http://auth:7000
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_WHITELIST_DOMAINS=login.microsoftonline.com
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_COOKIE_NAME=_oauth2_proxy
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_PASS_USER_HEADERS=true
      - OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER=true
      - OAUTH2_PROXY_SCOPE=openid profile email
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_SKIP_AUTH_ROUTES=^/(health|config|sso/login|local/login|logout|verify|logged-out)$$
      - OAUTH2_PROXY_OIDC_EMAIL_CLAIM=email
      - OAUTH2_PROXY_PASS_ACCESS_TOKEN=true
    networks:
      - backend
    deploy: {}

networks:
  backend:
    external: true

